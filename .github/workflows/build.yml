name: Build Desktop Apps

# Two separate jobs, so day-to-day pushes cost no artifact storage at all:
#
#   push to main  -> "check" only: compiles the app to catch breakage early.
#                    No installer is produced and nothing is uploaded.
#
#   tag v*        -> full build of the macOS .dmg and Windows .exe, uploaded
#                    straight to the update server over scp and attached to a
#                    GitHub Release. Nothing is stored as a workflow artifact.
#
# GitHub bills artifact storage, but not Releases, so this stays free no matter
# how often main is pushed.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ #
  # Every push to main: does it still build?                            #
  # ------------------------------------------------------------------ #
  check:
    name: Build check
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the renderer is compiled. Packaging an installer here would be
      # slow and would produce a file nobody downloads.
      - name: Build the renderer
        run: npm run build

      - name: Check the Electron entry points parse
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/updater.cjs
          node --check electron/config.cjs

  # ------------------------------------------------------------------ #
  # Tagged release: build the real installers and publish them          #
  # ------------------------------------------------------------------ #
  release:
    name: ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep building the other platform even if one of them fails.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (dmg)
            target: dist:mac
            pattern: release/*.dmg
          - os: windows-latest
            name: Windows (exe)
            target: dist:win
            pattern: |
              release/*.exe
              release/latest.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is only a git label; the installer is named from package.json.
      # If they disagree, users are offered a file whose version does not match
      # the manifest and auto-update breaks, so fail before anything is built.
      - name: Check the tag matches package.json
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"                       # strip any -beta.1 suffix
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME expects version $tag, but package.json is $pkg."
            echo "Bump it with 'npm version <new-version>', which tags the commit for you."
            exit 1
          fi
          echo "version $pkg matches tag $GITHUB_REF_NAME"

      - name: Build installer
        run: npm run ${{ matrix.target }}
        env:
          # The app is not code-signed, so stop electron-builder from
          # searching for a signing identity and failing the build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release/

      - name: Write the macOS version manifest
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg=$(basename "$(ls release/*.dmg | head -1)")
          printf '{\n  "version": "%s",\n  "url": "%s/updates/mac/%s"\n}\n' \
            "$version" "${{ secrets.UPDATE_HOST }}" "$dmg" > release/latest-mac.json
          cat release/latest-mac.json

      - name: Add the update server to known_hosts
        if: "!contains(github.ref_name, '-')"
        shell: bash
        run: |
          mkdir -p ~/.ssh
          # Pin the host key so the upload cannot be silently redirected.
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Install the deploy key
        if: "!contains(github.ref_name, '-')"
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # A pre-release tag (v1.0.1-beta.1, v2.0.0-rc.1) is built and attached to
      # a GitHub Release for testing, but is NOT sent to the update server, so
      # it never reaches users' machines.
      - name: Upload to the update server
        if: "!contains(github.ref_name, '-')"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            src="release/*.dmg release/latest-mac.json"; dest="mac"
          else
            src="release/*.exe release/latest.yml"; dest="win"
          fi
          # shellcheck disable=SC2086
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            $src "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }}:/var/www/updates/$dest/"

      # Each release adds ~370 MB. Left unchecked the droplet's disk fills up,
      # which would stop the Telegram bot's database as well as updates, so old
      # installers are removed as soon as the new one is safely in place.
      - name: Remove superseded installers
        if: "!contains(github.ref_name, '-')"
        shell: bash
        run: |
          set -euo pipefail
          # Prune only this platform's directory. The two jobs finish at
          # different times, so pruning both here could delete a version the
          # other platform has not uploaded yet.
          if [ "${{ runner.os }}" = "macOS" ]; then target=mac; else target=win; fi
          remote="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }}"
          # A per-platform name keeps the two concurrent jobs from overwriting
          # each other's copy of the script.
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/prune-old-releases.sh "$remote:/tmp/prune-$target.sh"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$remote" \
            "bash /tmp/prune-$target.sh 3 $target; rm -f /tmp/prune-$target.sh"

      # Rebuild the download page from what is now on disk, so it lists the new
      # release and drops anything pruning just removed. Both jobs run this;
      # it only reads the directories, so the later one simply wins.
      - name: Rebuild the download page
        if: "!contains(github.ref_name, '-')"
        shell: bash
        run: |
          set -euo pipefail
          target=$([ "${{ runner.os }}" = "macOS" ] && echo mac || echo win)
          remote="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }}"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/generate-index.sh "$remote:/tmp/genindex-$target.sh"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$remote" \
            "bash /tmp/genindex-$target.sh; rm -f /tmp/genindex-$target.sh"

      # Releases do not count toward the artifact storage quota, so this is a
      # free fallback if the droplet is ever unreachable.
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.pattern }}
          # A tag carrying a suffix (v1.0.1-beta.1) is a test build, so mark it
          # as a pre-release rather than presenting it as the current version.
          prerelease: ${{ contains(github.ref_name, '-') }}
